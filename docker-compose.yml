version: '3.8'
services:             
  cosc304-mysql:
    image: mysql:8.0
    container_name: cosc304-mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'testuser'
      MYSQL_USER: 'testuser'
      MYSQL_PASSWORD: '304testpw'            
      MYSQL_ROOT_PASSWORD: '304rootpw'
    ports:
      - '3306:3306'
    expose:
      - '3306'   
    volumes:
      - mysql-db:/var/lib/mysql
      - ./WebContent/ddl:/docker-entrypoint-initdb.d
    networks:
      network304:
        aliases:
          - cosc304_mysql
  cosc304-sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: cosc304-sqlserver
    platform: linux/arm64
    restart: always
    environment:
            ACCEPT_EULA: 'Y'
            SA_PASSWORD: '304#sa#pw'
    ports:
      - '1433:1433'
    expose:
      - '1433'
    volumes:
      - cosc304-db:/var/opt/mssql            
      - ./WebContent/ddl:/scripts
    networks:
      network304:
        aliases:
          - cosc304_sqlserver
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    image: cosc304-java
    depends_on:
      - cosc304-sqlserver
    container_name: cosc304-java
    volumes:
      - ./WebContent:/usr/local/tomcat/webapps/shop/
    networks:
      network304:
        aliases:
          - cosc304-java
    ports:
      - 80:8080
volumes: 
  cosc304-db:
  mysql-db:
networks:
  network304: